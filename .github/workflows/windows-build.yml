# Builds the Windows installer on every push to main / on demand, and PUBLISHES A RELEASE when you
# push a version tag (git tag v0.3.1 && git push origin v0.3.1). Installed copies of DeepFind look
# for that release (Settings -> Updates) and offer it to the user.
# The build is a cross-build on Linux (see packaging/build_windows.sh) — no Windows runner needed.
name: Windows installer

on:
  workflow_dispatch:
    inputs:
      with_models:
        description: "Bundle the AI models into the installer (+~350 MB)"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write        # needed to create the release on tag builds

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nsis zip
      - name: Version + update source
        run: |
          # a tag like v0.3.1 decides the version; other builds use the VERSION file
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "${GITHUB_REF_NAME#v}" > VERSION; fi
          echo "Building version $(cat VERSION)"
          # the built app checks THIS repository's releases for updates
          printf '{\n  "repo": "%s"\n}\n' "$GITHUB_REPOSITORY" > update_source.json
      - name: Tests
        run: |
          pip install -r requirements.txt
          pytest -q tests
      - name: Models (optional)
        if: ${{ inputs.with_models }}
        run: pip install fastembed rapidocr-onnxruntime && python scripts/download_models.py
      - name: Build installer
        env:
          WITH_MODELS: ${{ inputs.with_models && '1' || '0' }}
        run: bash packaging/build_windows.sh
      - name: Checksum
        run: |
          cd dist
          for f in DeepFind-Setup-*.exe; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: DeepFind-windows
          path: |
            dist/DeepFind-Setup-*.exe
            dist/DeepFind-Setup-*.exe.sha256
            dist/DeepFind-*-portable.zip
          if-no-files-found: error
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat VERSION)"
          # release notes = this version's section of CHANGES.md (shown in the app's "what's new")
          awk -v v="$V" '/^## /{p = (index($0, "## " v " ") == 1)} p' CHANGES.md > notes.md
          [ -s notes.md ] || echo "DeepFind $V" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/DeepFind-Setup-*.exe dist/DeepFind-Setup-*.exe.sha256 \
            dist/DeepFind-*-portable.zip --title "DeepFind $V" --notes-file notes.md
